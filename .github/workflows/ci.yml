name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run linters
      run: |
        flake8 PINNsrc/ tests/ --max-line-length=100 --extend-ignore=E203,W503 --count --statistics
        black PINNsrc/ tests/ --check --line-length=100
        isort PINNsrc/ tests/ --check-only
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=PINNsrc --cov-report=xml --cov-report=term -m "not slow and not cuda"
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  type-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mypy torch numpy
    
    - name: Run mypy
      run: |
        mypy PINNsrc/ --ignore-missing-imports --allow-untyped-defs
      continue-on-error: true
